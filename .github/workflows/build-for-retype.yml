name: Publish documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build && npm test
      # The install guide's first command pulls the image; never publish it first.
      - run: node scripts/check-image-published.mjs
      - name: Update the existing static publishing branch
        run: |
          git fetch origin retype
          git worktree add --detach /tmp/slatebox-docs-site origin/retype
          rsync -a --delete --exclude=.git dist/ /tmp/slatebox-docs-site/
          cd /tmp/slatebox-docs-site
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish documentation from ${GITHUB_SHA}"
            git push origin HEAD:retype
          fi
