<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Listening bench · SlateboxJS example</title>
  <link rel="stylesheet" href="https://slatebox.com/assets/engine/slateboxjs.css">
  <style>
    :root { color-scheme: light; font: 100%/1.5 system-ui, sans-serif; color: #24392f; background: #faf8ef; }
    * { box-sizing: border-box; }
    body { max-width: 54rem; margin: 0 auto; padding: clamp(1rem, 5vw, 3rem); }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    p { max-width: 38rem; margin: .75rem 0 1.25rem; }
    #board { position: relative; width: 100%; height: clamp(18rem, 48vh, 27rem); border: 1px solid #a8b4a8; }
    footer { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
    button { font: inherit; font-weight: 600; padding: .55rem 1rem; color: #fff; background: #263c32; border: 0; border-radius: .25rem; }
    button:enabled { cursor: pointer; }
    :focus-visible { outline: 3px solid #965f15; outline-offset: 3px; }
  </style>
</head>
<body>
  <h1>Listening bench</h1>
  <p>Move either note to see the connection follow. Double-click a note or select it and press F2 to rename it. Save your changes and reload to reopen the board.</p>
  <div id="board" aria-label="Listening bench decision map"></div>
  <footer>
    <button id="save" disabled>Save changes</button>
    <output id="status" role="status">Loading canvas…</output>
  </footer>
  <script data-cfasync="false" type="module">
    const status = document.querySelector('#status')
    const save = document.querySelector('#save')
    const storageKey = 'slatebox-listening-bench:' + location.pathname
    try {
      const { Slate } = await import('https://slatebox.com/assets/engine/slateboxjs.mjs')
      const slate = new Slate('#board', {
        name: 'Listening bench',
        containerStyle: { backgroundColor: '#f3f0e3' },
        showBirdsEye: false, showZoom: false, showMultiSelect: false,
        events: {
          onSlateChanged() {
            if (!save.disabled && status.textContent !== 'Unsaved changes.') status.textContent = 'Unsaved changes.'
          }
        }
      })

      let saved
      try { saved = localStorage.getItem(storageKey) } catch { /* Storage is optional. */ }
      if (saved) {
        await slate.loadJSON(saved)
        status.textContent = 'Reopened your saved board.'
      } else {
        const narrow = matchMedia('(max-width: 32rem)').matches
        const evidence = slate.addNode({
          id: 'evidence', x: 40, y: 80, width: 206, height: 98, fontSize: 22, shape: 'rectangle',
          text: 'Visitors stop to listen', backgroundColor: '#ecd18d', fontColor: '#24392f'
        })
        const decision = slate.addNode({
          id: 'decision', x: narrow ? 70 : 340, y: narrow ? 245 : 135, width: 206, height: 98, fontSize: 22, shape: 'rectangle',
          text: 'Set a bench by the speaker', backgroundColor: '#bdd4c7', fontColor: '#24392f'
        })
        await Promise.all([evidence.ready, decision.ready])
        evidence.relationships.addAssociation(decision, { showChildArrow: true })
        status.textContent = ''
      }
      slate.fitToContent()
      save.disabled = false
      save.onclick = () => {
        try {
          localStorage.setItem(storageKey, slate.exportJSON())
          status.textContent = 'Saved in this browser.'
        } catch {
          status.textContent = 'This browser could not save the board. Check site storage and try again.'
        }
      }
    } catch (error) {
      console.error(error)
      status.textContent = 'Could not open the canvas. Check the browser console for details.'
    }
  </script>
</body>
</html>
