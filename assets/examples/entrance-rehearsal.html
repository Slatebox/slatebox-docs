<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrance rehearsal · SlateboxJS example</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; padding: clamp(16px,5vw,72px); color: #262825; background: #f4f1e9; font: 16px/1.45 system-ui,sans-serif }
  main { max-width: 660px; margin: auto }
  h1 { font: 500 clamp(34px,7vw,62px)/1.03 Georgia,serif; margin: 0 0 20px }
  figure { margin: 0; overflow: hidden; background: #18201f; color: #f9f5ed; border-radius: 12px }
  .stage { height: clamp(140px,27vw,200px); position: relative; overflow: hidden; border-bottom: 2px solid #a79b7d;
    background: repeating-linear-gradient(87deg,#26302e,#26302e 12px,#1f2726 14px,#1f2726 26px) }
  .door { position: absolute; bottom: 0; left: 55%; width: 19%; height: 77%; border: 5px solid #78807a; border-bottom: 0; background: #1c2725 }
  .bench { position: absolute; left: 15%; bottom: 12%; width: 27%; height: 7px; background: #ac9c7e; box-shadow: 0 6px #3b3932 }
  .bench::before,.bench::after { content: ''; position: absolute; width: 5px; height: 18px; top: 8px; background: #a29a85 }
  .bench::before { left: 7% } .bench::after { right: 7% }
  .lit .door { background: #ffd485; border-color: #f4ce78; box-shadow: 0 0 55px 11px #e4ae6659 }
  figcaption { padding: 14px 20px; min-height: 60px }
  .console { padding: 16px 0 }
  h2 { margin: 0 0 5px; font-size: 18px }
  p { margin: 8px 0 14px }
  button, a { font: inherit; color: inherit }
  button { cursor: pointer }
  :focus-visible { outline: 3px solid #006b76; outline-offset: 3px }
  .rail { position: relative; height: 72px; background: linear-gradient(90deg,#d7d9cf 0 49.8%,#b0b7aa 50%,#d7d9cf 50.2%); border-radius: 8px }
  .rail::before { content: ''; position: absolute; left: 12%; right: 12%; top: 50%; height: 3px; background: #90978a }
  #cue { position: absolute; left: var(--position,25%); top: 50%; transform: translate(-50%,-50%); width: 43%; max-width: 200px; min-height: 44px;
    padding: 4px 8px; border-radius: 5px; border: 1px solid #303b32; background: #fff9de; touch-action: none; cursor: grab; user-select: none }
  #cue:active { cursor: grabbing }
  #stops { display: grid; grid-template-columns: 1fr 1fr; gap: 4px }
  #stops button { min-height: 44px; border: 0; background: transparent; text-decoration: underline; text-underline-offset: 3px }
  #stops button:disabled { opacity: .5 }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 10px 0 }
  .actions a { background: #213b32; color: white; padding: 11px 15px; border-radius: 5px; text-decoration: none }
  .actions button { border: 1px solid #95998f; background: transparent; padding: 10px 13px; border-radius: 5px }
</style>
<main>
  <h1 id="title">Entrance rehearsal</h1>
  <figure>
    <div id="stage" class="stage" aria-hidden="true"><span class="bench"></span><span class="door"></span></div>
    <figcaption id="monitor" role="status">Loading the light cue…</figcaption>
  </figure>
  <section class="console" aria-label="Light cue">
    <h2>When should the light come up?</h2>
    <p id="help">Drag the cue across the rail. With a keyboard, focus the cue and use the arrow keys to preview, Enter to place it or Escape to cancel. You can also choose a scene by name.</p>
    <div id="rail" class="rail"><button id="cue" aria-describedby="help" disabled>Warm sidelight up</button></div>
    <div id="stops" aria-label="Choose a scene"></div>
    <p id="placement"></p>
    <div class="actions"><a id="open" hidden>Open this rehearsal in Slatebox</a><button id="undo" disabled>Undo last move</button></div>
  </section>
</main>
<script data-cfasync="false" type="module">
  const {
    validateWorkshop, availableLanes, moveWorkshopCard, resolveWorkshopSignals, encodeWorkshopFragment
  } = await import('https://slatebox.com/assets/engine/workshop-model.mjs').catch(error => {
    document.getElementById('monitor').textContent = 'The workshop model could not load. Connect to the internet and refresh.'
    throw error
  })

  // Edit these labels, outcomes and destination rules, then reload the file.
  const rehearsal = validateWorkshop({
    version: 1, title: 'Entrance rehearsal',
    lanes: [{ id: 'bench', label: 'Actor sits' }, { id: 'door', label: 'Door opens' }],
    presentationOrder: ['door', 'bench'],
    cards: [
      { id: 'rain', label: 'Fade the rain', laneId: 'door' },
      { id: 'light', label: 'Warm sidelight up', laneId: 'bench' }
    ],
    signals: [{
      id: 'entrance', label: 'Entrance light', cardId: 'light', laneId: 'door',
      whenPresent: 'The doorway glows amber.', whenAbsent: 'The doorway stays dark.'
    }]
  })

  let saved = rehearsal, preview = null, previous = null, pointer = null
  const byId = id => document.getElementById(id)
  const cue = byId('cue'), rail = byId('rail')
  const card = board => board.cards.find(item => item.id === 'light')
  const legal = id => availableLanes(saved, card(saved)).some(lane => lane.id === id)
  const stops = saved.lanes.map(lane => {
    const button = document.createElement('button')
    button.textContent = lane.label
    button.onclick = () => { audition(lane.id); commit() }
    byId('stops').append(button)
    return button
  })

  function render() {
    const board = preview ?? saved
    const [signal] = resolveWorkshopSignals(board)
    const position = board.lanes.findIndex(lane => lane.id === card(board).laneId)
    byId('title').textContent = board.title
    byId('stage').classList.toggle('lit', signal.present)
    byId('monitor').textContent = (preview ? 'Preview · ' : '') + signal.text
    byId('placement').textContent = 'Saved scene: ' + saved.lanes.find(lane => lane.id === card(saved).laneId).label
    cue.textContent = card(board).label
    rail.style.setProperty('--position', ((position + 0.5) / board.lanes.length * 100) + '%')
    stops.forEach((button, index) => { button.disabled = !legal(board.lanes[index].id) })
    byId('undo').disabled = !previous
    // Only the committed model may leave this page.
    byId('open').href = 'https://app.slatebox.com/new/workshop' + encodeWorkshopFragment(saved)
  }

  function audition(id) {
    preview = legal(id) && id !== card(saved).laneId ? moveWorkshopCard(saved, card(saved).id, id) : null
    render()
  }
  function commit() {
    if (preview) { previous = saved; saved = preview }
    preview = null
    render()
  }
  function cancel() {
    preview = null
    if (pointer !== null && cue.hasPointerCapture(pointer)) cue.releasePointerCapture(pointer)
    pointer = null
    render()
  }
  function destination(event) {
    const box = rail.getBoundingClientRect()
    if (event.clientX < box.left || event.clientX >= box.right || event.clientY < box.top || event.clientY >= box.bottom) return null
    const index = Math.floor((event.clientX - box.left) / box.width * saved.lanes.length)
    return saved.lanes[index].id
  }
  cue.onpointerdown = event => {
    if (pointer !== null || event.button !== 0) return
    cue.focus()
    pointer = event.pointerId
    cue.setPointerCapture(pointer)
  }
  cue.onpointermove = event => { if (event.pointerId === pointer) audition(destination(event)) }
  cue.onpointerup = event => {
    if (event.pointerId !== pointer) return
    audition(destination(event))
    commit()
    cancel()
  }
  cue.onpointercancel = cancel
  cue.onlostpointercapture = cancel
  cue.onkeydown = event => {
    if (!['ArrowLeft','ArrowRight','Escape','Enter',' '].includes(event.key)) return
    event.preventDefault()
    if (event.key === 'Escape') cancel()
    else if (event.key === 'Enter' || event.key === ' ') commit()
    else {
      const current = saved.lanes.findIndex(lane => lane.id === card(preview ?? saved).laneId)
      const index = Math.max(0, Math.min(stops.length - 1, current + (event.key === 'ArrowRight' ? 1 : -1)))
      audition(saved.lanes[index].id)
    }
  }
  cue.onblur = cancel
  byId('undo').onclick = () => { if (previous) { saved = previous; previous = null; cancel() } }
  cue.disabled = false
  byId('open').hidden = false
  render()
</script>
</html>
